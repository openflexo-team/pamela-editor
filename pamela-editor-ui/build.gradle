dependencies {
  implementation project(':pamela-editor-core')
  implementation ginaSwing()
  implementation dianaSwing()
  implementation dianaApi()
  implementation diana()
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.4'
  // Spoon is needed for the SpoonOutlineView which displays CtType/CtMethod etc. directly
  // (decision D2: intentional exception to the no-Spoon-in-UI-API rule)
  implementation group: 'fr.inria.gforge.spoon', name: 'spoon-core', version: '9.1.0'
}

task run(type: JavaExec) {
  group = 'application'
  description = 'Launch the PAMELA Editor'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'org.openflexo.pamela.editor.ui.LaunchPamelaEditor'
  // macOS: use screen menu bar
  jvmArgs '-Xmx512m'
  if (System.getProperty('os.name').toLowerCase().contains('mac')) {
    jvmArgs '-Dapple.laf.useScreenMenuBar=true'
  }
  // Forward paint-performance diagnostic flags from the gradle invocation to the forked JVM,
  // e.g. ./gradlew :pamela-editor-ui:run -Ddiana.paintdebug=true [-Ddiana.disableRegionCache=true]
  ['diana.paintdebug', 'diana.disableRegionCache', 'diana.disableBoundsCache'].each { String key ->
    if (System.getProperty(key) != null) {
      systemProperty key, System.getProperty(key)
    }
  }
}

// Reproducible paint-performance benchmark of an entity-box move (Diana paint investigation, §32).
//   ./gradlew :pamela-editor-ui:paintBench -Ddiana.paintdebug=true \
//       [--args="<pamelaFile> <neighbours> <frames> [<entityName>]"]
// NOTE: this runs against the *resolved* diana artifact. To measure local diana changes, first
// `publishToMavenLocal` from /diana (and add mavenLocal()), or use an includeBuild composite.
task paintBench(type: JavaExec) {
  group = 'verification'
  description = 'Benchmark an entity-box move on a PamelaClassDiagram (paint-perf diagnostic, §32)'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'org.openflexo.pamela.editor.ui.perf.PaintMoveBenchmark'
  if (System.getProperty('os.name').toLowerCase().contains('mac')) {
    jvmArgs '-Dapple.laf.useScreenMenuBar=true'
  }
  ['diana.paintdebug', 'diana.disableRegionCache', 'diana.disableBoundsCache'].each { String key ->
    if (System.getProperty(key) != null) {
      systemProperty key, System.getProperty(key)
    }
  }
}
